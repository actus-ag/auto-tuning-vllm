# Default values for vllm-server chart
# This is a template - trial-specific values will be merged in by auto-tune-vllm

# Model configuration
modelArtifacts:
  uri: ""  # Will be set from trial config (e.g., "hf://Qwen/Qwen3-0.6B")
  name: ""  # Will be set from trial config
  authSecretName: ""  # Optional: HuggingFace token secret name

# vLLM server deployment
decode:
  create: true
  replicas: 1
  containers:
    - name: vllm
      # image: # Omitted - will use llm-d-cuda image for prefix-aware routing experiments
      # For prefix-aware routing experiments, use: ghcr.io/llm-d/llm-d-cuda:v0.3.1 (default)
      # For disaggregation experiments, use: ghcr.io/llm-d/llm-d-inference-sim:v0.6.1
      # modelCommand can be: "vllmServe", "imageDefault", or "custom"
      # - vllmServe: Uses command ["vllm", "serve"] with args
      # - imageDefault: Uses image's default entrypoint with args
      # - custom: Uses user-provided command and args
      modelCommand: "custom"  # Required for prefix-aware routing with KV events
      command:
        - /bin/sh
        - '-c'
      args: []  # Will be populated from trial parameters as a shell command string
      env: []  # Will be populated from trial environment variables
      ports:
        - containerPort: 8200
          name: http
          protocol: TCP
        - containerPort: 5557
          name: zmq
          protocol: TCP
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          nvidia.com/gpu: "1"
      livenessProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /health
          port: http
        periodSeconds: 5
        timeoutSeconds: 2
        failureThreshold: 3
      startupProbe:
        httpGet:
          path: /health
          port: http
        initialDelaySeconds: 15
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 60
      volumeMounts: []
  volumes: []

# Service configuration
service:
  type: ClusterIP
  port: 8000
  targetPort: 8200  # vLLM listens on 8200 for prefix-aware routing

# Routing (optional - for gateway integration)
routing:
  servicePort: 8000

# PostgreSQL StatefulSet configuration
postgresql:
  enabled: true
  namespace: llm-d-trials
  replicas: 1
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  database: postgres
  auth:
    username: postgres
    password: postgres  # Change this in production!
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    storageClass: nfs-storage
    accessMode: ReadWriteOnce
    size: 20Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env: []
  volumeMounts: []
  config: {}
