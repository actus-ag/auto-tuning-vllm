{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "vllm-server.fullname" . }}-postgresql-secret
  namespace: {{ .Values.postgresql.namespace | default .Release.Namespace }}
  labels:
    {{- include "vllm-server.labels" . | nindent 4 }}
    component: postgresql
type: Opaque
data:
  postgres-user: {{ .Values.postgresql.auth.username | b64enc | quote }}
  postgres-password: {{ .Values.postgresql.auth.password | b64enc | quote }}
{{- end }}
