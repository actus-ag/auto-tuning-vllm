# Example study configuration for MLPerf Harness - Server Scenario on Kubernetes
# This uses the direct Kubernetes Deployment/Pod backend (no Helm)
# Simpler than Helm backend - creates Deployments and Services directly

study:
  prefix: "mlperf_server_k8s_direct"
  database_url: "postgresql://postgres:postgres@localhost:5432/optuna-k8s-direct"
  # For Kubernetes: Use port-forwarding or cluster-internal database URL
  # Example with port-forward: kubectl port-forward -n <namespace> svc/postgresql 5432:5432

# Execution backend configuration for Kubernetes (direct Deployment/Pod)
execution:
  backend: "k8s"  # or "kubernetes"
  k8s:
    namespace: "llm-d-trials"  # Kubernetes namespace for deployments
    vllm_image: "vllm/vllm-openai:latest"  # vLLM container image
    benchmark_image: "quay.io/rh-ee-nmiriyal/mlperf-6.0:harness"  # MLPerf harness image
    service_type: "ClusterIP"  # Service type: ClusterIP, NodePort, or LoadBalancer
    service_port: 8000  # Service port for vLLM server
    kubeconfig: "/path/to/your/kubeconfig"  # Optional: custom kubeconfig path
    # Optional: Resource requests and limits
    resource_requests:
      nvidia.com/gpu: "1"
      memory: "16Gi"
    resource_limits:
      nvidia.com/gpu: "1"
      memory: "32Gi"

optimization:
  # Single objective: Optimize throughput
  approach: "single_objective"
  objectives:
    - metric: "output_tokens_per_second"  # MLPerf throughput metric
      direction: "maximize"
      percentile: "median"
  sampler: "tpe"  # Tree-structured Parzen Estimator
  n_trials: 50
  skip_baseline: true
  # Note: Kubernetes backend only supports sequential trials (max_concurrent_trials=1)

benchmark:
  # Constants: fixed values for all trials
  benchmark_type: "mlperf"
  model: "RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8"
  scenario: "offline"  # MLPerf Server scenario
  dataset_path: "cnn_eval.json"  # Path to dataset file (must be accessible in pod)
  lg_model_name: "llama3_1-8b"  # LoadGen model name
  num_samples: 13368  # Number of samples to process
  output_dir: "LLAMA3_1-8B-OFFLINE"  # Output directory for results
  mlflow_experiment_name: "mlperf-offline-k8s-direct"  # MLflow experiment name
  mlflow_host: "150.239.115.202"  # MLflow host address (must be accessible from pods)
  test_mode: "performance"  # Test mode: performance or accuracy

  # Tunables: optimized by Optuna
  # Note: These tunables are only applicable to Server scenario
  tunables:
    server_target_qps:
      enabled: true
      min: 10.0
      max: 50.0
      step: 5.0
    server_coalesce_queries:
      enabled: true
      options: [True, False]  # Boolean parameter - must explicitly specify options

logging:
  # At least one of the following must be provided and must be valid
  database_url: "postgresql://postgres:postgres@localhost:5432/optuna-k8s-direct"
  file_path: "/tmp/auto-tune-vllm-logs"  # Local file path (on the machine running auto-tune)
  log_level: "INFO"

parameters:
  # vLLM parameters to optimize
  max_num_batched_tokens:
    enabled: true
    min: 2048
    max: 16384
    step: 2048
    
  gpu_memory_utilization:
    enabled: true
    min: 0.85
    max: 0.95
    step: 0.05
    
  kv_cache_dtype:
    enabled: true
    options: ["auto", "fp8"]
    
  max_num_seqs:
    enabled: true
    min: 32
    max: 256
    step: 32

# Static parameters (applied to all trials)
static_parameters:
  tensor_parallel_size: 1  # Use 1 GPU per trial
  max_model_len: 16384
