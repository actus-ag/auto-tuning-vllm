# Example study configuration for GuideLLM benchmark on Kubernetes
# This uses the direct Kubernetes Deployment/Pod backend (no Helm)
# Simpler than Helm backend - creates Deployments and Services directly

study:
  prefix: "guidellm_k8s_direct"
  database_url: "postgresql://postgres:postgres@localhost:5432/optuna-k8s-direct"
  # For Kubernetes: Use port-forwarding or cluster-internal database URL
  # Example with port-forward: kubectl port-forward -n <namespace> svc/postgresql 5432:5432

# Execution backend configuration for Kubernetes (direct Deployment/Pod)
execution:
  backend: "k8s"  # or "kubernetes"
  k8s:
    namespace: "llm-d-trials"  # Kubernetes namespace for deployments
    vllm_image: "vllm/vllm-openai:latest"  # vLLM container image
    benchmark_image: "ghcr.io/vllm-project/guidellm:v0.3.1"  # GuideLLM benchmark image
    service_type: "ClusterIP"  # Service type: ClusterIP, NodePort, or LoadBalancer
    service_port: 8000  # Service port for vLLM server
    kubeconfig: "/path/to/your/kubeconfig"  # Optional: custom kubeconfig path
    model_pvc: "model-pvc"
    benchmark_pvc: "results-pvc"  # REQUIRED: PersistentVolumeClaim for benchmark results storage
    # Results are stored hierarchically: {study_name}/trial_{trial_id}/benchmark-results.json
    # The PVC must exist before running trials and should have ReadWriteOnce or ReadWriteMany access mode
    # Optional: Resource requests and limits
    resource_requests:
      nvidia.com/gpu: "1"
    resource_limits:
      nvidia.com/gpu: "1"

optimization:
  # Single objective: Optimize throughput
  approach: "single_objective"
  objectives:
    - metric: "output_tokens_per_second"  # GuideLLM throughput metric
      direction: "maximize"
      percentile: "median"
  sampler: "tpe"  # Tree-structured Parzen Estimator
  n_trials: 50
  skip_baseline: true
  # Note: Kubernetes backend only supports sequential trials (max_concurrent_trials=1)

benchmark:
  # Constants: fixed values for all trials
  benchmark_type: "guidellm"
  model: "RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8"
  max_seconds: 60  # Benchmark duration in seconds
  dataset: null  # Use synthetic data (set to dataset path or HuggingFace dataset name for real data)
  prompt_tokens: 1000  # Default prompt tokens for synthetic data
  output_tokens: 1000  # Default output tokens for synthetic data
  logging_level: "INFO"  # GuideLLM logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  samples: 100

  # Tunables: optimized by Optuna
  tunables:
    rate:
      enabled: true
      min: 10
      max: 100
      step: 10
    # samples:
    #   enabled: true
    #   min: 500
    #   max: 2000
    #   step: 500
    # prompt_tokens:
    #   enabled: true
    #   min: 100
    #   max: 2000
    #   step: 100
    # output_tokens:
    #   enabled: true
    #   min: 100
    #   max: 2000
    #   step: 100

logging:
  # At least one of the following must be provided and must be valid
  database_url: "postgresql://postgres:postgres@localhost:5432/optuna-k8s-direct"
  file_path: "/tmp/auto-tune-vllm-logs"  # Local file path (on the machine running auto-tune)
  log_level: "INFO"

parameters:
  # vLLM parameters to optimize
  max_num_batched_tokens:
    enabled: true
    min: 2048
    max: 16384
    step: 2048
    
  gpu_memory_utilization:
    enabled: true
    min: 0.85
    max: 0.95
    step: 0.05
    
  kv_cache_dtype:
    enabled: true
    options: ["auto", "fp8"]
    
  max_num_seqs:
    enabled: true
    min: 32
    max: 256
    step: 32

# Static parameters (applied to all trials)
static_parameters:
  tensor_parallel_size: 1  # Use 1 GPU per trial
  max_model_len: 16384
