# Example study configuration for MLPerf Harness - Server Scenario
# This demonstrates using MLPerf harness as a benchmark provider with Server scenario
# and tunable parameters (server_target_qps and server_coalesce_queries)

study:
  name: "mlperf_server_optimization_example"
  database_url: "postgresql://postgres:postgres@localhost:5432/optuna"

optimization:
  # Single objective: Optimize throughput
  approach: "single_objective"
  objectives:
    - metric: "output_tokens_per_second"  # MLPerf throughput metric
      direction: "maximize"
      percentile: "median"
  sampler: "tpe"  # Tree-structured Parzen Estimator
  n_trials: 50

benchmark:
  # Constants: fixed values for all trials
  benchmark_type: "mlperf"
  model: "RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8"
  scenario: "Server"  # MLPerf Server scenario
  dataset_path: "cnn_eval.json"  # Path to dataset file
  lg_model_name: "llama3_1-8b"  # LoadGen model name
  num_samples: 13368  # Number of samples to process
  output_dir: "LLAMA3_1-8B-SERVER"  # Output directory for results
  mlflow_experiment_name: "mlperf-server-optimization"  # MLflow experiment name
  mlflow_host: "150.239.115.202"  # MLflow host address
  test_mode: "performance"  # Test mode: performance or accuracy

  # Tunables: optimized by Optuna
  # Note: These tunables are only applicable to Server scenario
  tunables:
    server_target_qps:
      enabled: true
      min: 10.0
      max: 50.0
      step: 5.0
    server_coalesce_queries:
      enabled: true
      options: [True, False]  # Boolean parameter - must explicitly specify options

logging:
  # At least one of the following must be provided and must be valid
  database_url: "postgresql://postgres:postgres@localhost:5432/tuner-user"
  file_path: "/tmp/auto-tune-vllm-logs"
  log_level: "INFO"

parameters:
  # vLLM parameters to optimize
  max_num_batched_tokens:
    enabled: true
    min: 2048
    max: 16384
    step: 2048
    
  gpu_memory_utilization:
    enabled: true
    min: 0.85
    max: 0.95
    step: 0.05
    
  kv_cache_dtype:
    enabled: true
    options: ["auto", "fp8"]
    
  max_num_seqs:
    enabled: true
    min: 32
    max: 256
    step: 32

# Static parameters (applied to all trials)
static_parameters:
  tensor_parallel_size: 1  # Use 1 GPU per trial
  max_model_len: 16384
