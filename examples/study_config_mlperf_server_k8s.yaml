# Example study configuration for MLPerf Harness - Server Scenario on Kubernetes
# This is the basic MLPerf Server config adapted for Kubernetes deployment
# 
# To deploy on Kubernetes, add the execution section with backend: "helm"
# and configure the Helm settings below.

study:
  name: "mlperf_server_optimization_example"
  database_url: "postgresql://postgres:postgres@localhost:5432/optuna"
  # For Kubernetes: Use port-forwarding or cluster-internal database URL
  # Example with port-forward: kubectl port-forward -n <namespace> svc/postgresql 5432:5432

# Execution backend configuration for Kubernetes
execution:
  backend: "helm"
  helm:
    # REQUIRED: Specify chart type
    chart_type: "llm-d-modelservice"
    
    # Deploy full stack (infra, gaie, modelservice)
    deploy_full_stack: true
    release_name_postfix: "mlperf-server"
    
    # Infra chart configuration
    infra_chart_repo: "https://llm-d-incubation.github.io/llm-d-infra/"
    infra_chart_name: "llm-d-infra"
    infra_chart_version: "v1.3.4"
    
    # Gaie chart configuration
    gaie_chart_version: "v1.2.0"
    
    # Use llm-d-modelservice chart from repository
    chart_repo: "https://llm-d-incubation.github.io/llm-d-modelservice/"
    chart_name: "llm-d-modelservice"
    chart_version: "v0.3.17"
    
    namespace: "llm-d-trials"  # Kubernetes namespace for deployments
    benchmark_image: "quay.io/rh-ee-nmiriyal/mlperf-6.0:harness"  # MLPerf harness image
    kubeconfig: "/path/to/your/kubeconfig"  # Optional: custom kubeconfig path

optimization:
  # Single objective: Optimize throughput
  approach: "single_objective"
  objectives:
    - metric: "throughput"  # MLPerf throughput metric
      direction: "maximize"
      percentile: "median"
  sampler: "tpe"  # Tree-structured Parzen Estimator
  n_trials: 50
  # Note: Helm backend only supports sequential trials (max_concurrent_trials=1)

benchmark:
  # Constants: fixed values for all trials
  benchmark_type: "mlperf"
  model: "RedHatAI/Meta-Llama-3.1-8B-Instruct-FP8"
  scenario: "Server"  # MLPerf Server scenario
  dataset_path: "cnn_eval.json"  # Path to dataset file (must be accessible in pod)
  lg_model_name: "llama3_1-8b"  # LoadGen model name
  num_samples: 13368  # Number of samples to process
  output_dir: "LLAMA3_1-8B-SERVER"  # Output directory for results
  mlflow_experiment_name: "mlperf-server-optimization"  # MLflow experiment name
  mlflow_host: "150.239.115.202"  # MLflow host address (must be accessible from pods)
  test_mode: "performance"  # Test mode: performance or accuracy

  # Tunables: optimized by Optuna
  # Note: These tunables are only applicable to Server scenario
  tunables:
    server_target_qps:
      enabled: true
      min: 10.0
      max: 50.0
      step: 5.0
    server_coalesce_queries:
      enabled: true
      options: [True, False]  # Boolean parameter - must explicitly specify options

logging:
  # At least one of the following must be provided and must be valid
  database_url: "postgresql://postgres:postgres@localhost:5432/tuner-user"
  file_path: "/tmp/auto-tune-vllm-logs"  # Local file path (on the machine running auto-tune)
  log_level: "INFO"

parameters:
  # vLLM parameters to optimize
  max_num_batched_tokens:
    enabled: true
    min: 2048
    max: 16384
    step: 2048
    
  gpu_memory_utilization:
    enabled: true
    min: 0.85
    max: 0.95
    step: 0.05
    
  kv_cache_dtype:
    enabled: true
    options: ["auto", "fp8"]
    
  max_num_seqs:
    enabled: true
    min: 32
    max: 256
    step: 32

# Static parameters (applied to all trials)
static_parameters:
  tensor_parallel_size: 1  # Use 1 GPU per trial
  max_model_len: 16384
