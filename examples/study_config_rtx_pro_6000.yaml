# Optimization study: Gemma 4 / GLM-5 class model on single RTX PRO 6000 Blackwell (96GB)
# Goal: Find optimal vLLM params for throughput + low latency on 1 GPU

study:
  prefix: "rtx_pro_6000_single_gpu"
  # Will auto-generate unique name like: rtx_pro_6000_single_gpu_123456
  # Uses local SQLite (no PostgreSQL needed)

optimization:
  # Multi-objective: find the Pareto frontier of throughput vs responsiveness
  approach: "multi_objective"
  objectives:
    - metric: "output_tokens_per_second"
      direction: "maximize"
      percentile: "median"
    - metric: "time_to_first_token_ms"
      direction: "minimize"
      percentile: "p95"
  sampler: "nsga2"        # Best for multi-objective
  n_trials: 150           # Good coverage for this parameter space

benchmark:
  benchmark_type: "guidellm"
  # Replace with actual model ID when available, e.g.:
  #   "google/gemma-4-27b-it-fp8" or "THUDM/glm-5-32b-fp8"
  model: "google/gemma-4-27b-it"
  max_seconds: 300        # 5 min per trial for stable measurements
  dataset: null           # Synthetic data
  prompt_tokens: 2000     # Realistic prompt length
  output_tokens: 1000     # Realistic output length
  rate: 20                # 20 concurrent requests (realistic multi-user load)

baseline:
  enabled: true
  concurrency_levels: [10, 20, 30]  # Test baseline at different loads

logging:
  file_path: "/tmp/auto-tune-vllm-rtx-pro-6000/logs"
  log_level: "INFO"

# Fixed parameters: single GPU, no parallelism
static_parameters:
  tensor_parallel_size: 1          # Single GPU only
  max_model_len: 32768             # 32K context (adjust based on your needs)
  # quantization: "fp8"            # Uncomment if model isn't pre-quantized
  # max_num_seqs: 64               # Optional: cap concurrent sequences

static_environment_variables:
  VLLM_USE_V1: "1"                 # Use vLLM v1 engine
  VLLM_STARTUP_TIMEOUT: "600"      # 10 min startup (large model loading)
  CUDA_VISIBLE_DEVICES: "0"        # Pin to GPU 0, leave GPU 1 free for OCR

# Run with:
#   auto-tune-vllm optimize --config examples/study_config_rtx_pro_6000.yaml \
#     --backend local --max-concurrent-trials 1

# Parameters to optimize
parameters:
  # HIGH IMPACT: Memory allocation for KV-cache
  gpu_memory_utilization:
    enabled: true
    min: 0.90
    max: 0.97                      # Blackwell has good memory management
    step: 0.01

  # HIGH IMPACT: FP8 KV-cache doubles cache capacity
  kv_cache_dtype:
    enabled: true
    options: ["auto", "fp8"]       # fp8 typically 2x throughput improvement

  # HIGH IMPACT: Batching controls throughput/latency tradeoff
  max_num_batched_tokens:
    enabled: true
    min: 2048
    max: 32768
    step: 2048

  # MEDIUM IMPACT: Block size affects memory fragmentation
  block_size:
    enabled: true
    options: [8, 16, 32]

  # MEDIUM IMPACT: CUDA graph optimization
  max_seq_len_to_capture:
    enabled: true
    min: 4096
    max: 32768
    step: 4096

  # MEDIUM IMPACT: Chunked prefill tuning
  long_prefill_token_threshold:
    enabled: true
    options: [0, 512, 1024, 2048, 4096]

  max_num_partial_prefills:
    enabled: true
    options: [1, 2, 4]

  # MEDIUM IMPACT: Scheduling
  scheduling_policy:
    enabled: true
    options: ["fcfs", "priority"]

  # LOW-MEDIUM IMPACT: Prefix caching (helps with repeated prompts)
  enable_prefix_caching:
    enabled: true
    options: [true, false]

  # OPTIONAL: Attention backend (uncomment to test)
  # VLLM_ATTENTION_BACKEND:
  #   enabled: true
  #   type: environment
  #   options: ["FLASH_ATTN", "FLASHINFER"]
